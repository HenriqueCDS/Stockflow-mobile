name: homestock_mobile
description: HomeStock – Controle de estoque via NFC-e
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  dio: ^5.4.3
  flutter_secure_storage: ^9.2.2
  mobile_scanner: ^5.2.3
  intl: ^0.20.3
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/images/

# Ícone do app (dart run flutter_launcher_icons). Fontes em assets/icon/.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/app_icon_legacy.png
  adaptive_icon_background: "#FF7A00"
  adaptive_icon_foreground: assets/icon/app_icon_foreground.png
  remove_alpha_ios: true
  image_path_ios: assets/icon/app_icon.png

# Splash laranja nos dois temas (dart run flutter_native_splash:create).
flutter_native_splash:
  color: "#FF7A00"
  image: assets/splash/splash_glyph.png
  android_12:
    color: "#FF7A00"
    image: assets/splash/splash_glyph.png
  ios: true
  android: true
